name: Notify New Posts

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**.md" # Will be .mdx soon!

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find newly added posts
        id: diff
        run: |
          # Build the JSON array directly so an empty diff does not invoke
          # xargs with no operands.
          SLUGS=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- 'content/posts/*.md' \
            | sed 's#^.*/##; s/\.md$//' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "New post slugs: $SLUGS"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Call notify endpoint
        if: steps.diff.outputs.slugs != '[]'
        run: |
          curl --fail-with-body -X POST https://the3d.vercel.app/api/notify \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NOTIFY_SECRET }}" \
            -d '{"slugs": ${{ steps.diff.outputs.slugs }}}'
